<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TRACE</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f4ef;
        color: #111;
        font-family: Arial, Helvetica, sans-serif;
    }

    body {
        position: relative;
    }

    #canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
    }

    .top {
        position: absolute;
        top: 28px;
        left: 34px;
        right: 34px;

        display: flex;
        justify-content: space-between;
        align-items: flex-start;

        pointer-events: none;
        z-index: 5;
    }

    .wordmark {
        font-size: 17px;
        letter-spacing: 0.22em;
        font-weight: 500;
    }

    .counter {
        font-family: "Courier New", monospace;
        font-size: 14px;
        color: #777;
        letter-spacing: 0.08em;
    }

    .intro {
        position: absolute;
        left: 50%;
        top: 50%;

        transform: translate(-50%, -50%);
        text-align: center;

        pointer-events: none;
        z-index: 4;

        transition:
            opacity 0.8s ease,
            transform 0.8s ease;
    }

    .intro.hidden {
        opacity: 0;
        transform: translate(-50%, -54%);
    }

    .title {
        margin: 0;

        font-size: clamp(72px, 15vw, 170px);
        font-weight: 400;
        letter-spacing: -0.07em;
        line-height: 0.8;
    }

    .subtitle {
        margin-top: 34px;

        font-family: "Courier New", monospace;
        font-size: 12px;
        letter-spacing: 0.25em;
        text-transform: uppercase;

        color: #777;
    }

    .instruction {
        position: absolute;
        left: 34px;
        bottom: 32px;

        max-width: 260px;

        font-size: 13px;
        line-height: 1.6;
        color: #777;

        pointer-events: none;
        z-index: 5;

        transition: opacity 0.6s ease;
    }

    .instruction.hidden {
        opacity: 0;
    }

    .controls {
        position: absolute;
        right: 34px;
        bottom: 32px;

        display: flex;
        gap: 10px;

        z-index: 6;
    }

    button {
        appearance: none;

        border: 1px solid #aaa;
        background: rgba(245, 244, 239, 0.8);

        color: #333;

        padding: 12px 17px;

        font-family: "Courier New", monospace;
        font-size: 11px;
        letter-spacing: 0.14em;

        cursor: pointer;

        transition:
            background 0.2s ease,
            color 0.2s ease,
            border-color 0.2s ease;
    }

    button:hover {
        background: #111;
        color: #f5f4ef;
        border-color: #111;
    }

    button:active {
        transform: translateY(1px);
    }

    .gallery-link {
        position: absolute;
        left: 50%;
        bottom: 34px;

        transform: translateX(-50%);

        font-family: "Courier New", monospace;
        font-size: 10px;
        letter-spacing: 0.18em;
        text-transform: uppercase;

        color: #999;

        pointer-events: none;
        z-index: 5;

        opacity: 0;
        transition: opacity 0.6s ease;
    }

    .gallery-link.visible {
        opacity: 1;
    }

    @media (max-width: 600px) {

        .top {
            top: 22px;
            left: 22px;
            right: 22px;
        }

        .wordmark {
            font-size: 15px;
        }

        .counter {
            font-size: 12px;
        }

        .title {
            font-size: 21vw;
        }

        .subtitle {
            margin-top: 25px;
            font-size: 10px;
            letter-spacing: 0.18em;
        }

        .instruction {
            left: 22px;
            bottom: 25px;
            max-width: 190px;
            font-size: 12px;
        }

        .controls {
            right: 22px;
            bottom: 25px;

            flex-direction: column;
            gap: 7px;
        }

        button {
            padding: 10px 13px;
            font-size: 10px;
        }

        .gallery-link {
            bottom: 19px;
            display: none;
        }
    }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="top">
    <div class="wordmark">TRACE</div>
    <div class="counter" id="counter">0000</div>
</div>

<div class="intro" id="intro">
    <h1 class="title">TRACE</h1>

    <div class="subtitle">
        gesture / algorithm / line
    </div>
</div>

<div class="instruction" id="instruction">
    Move across the surface.<br>
    Your gesture becomes a trace.
</div>

<div class="controls">
    <button id="clearButton" type="button">CLEAR</button>
    <button id="generateButton" type="button">GENERATE</button>
</div>

<div class="gallery-link" id="galleryLink">
    gallery / coming next
</div>

<script>
(() => {

    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    const counter = document.getElementById("counter");
    const intro = document.getElementById("intro");
    const instruction = document.getElementById("instruction");
    const galleryLink = document.getElementById("galleryLink");

    const clearButton = document.getElementById("clearButton");
    const generateButton = document.getElementById("generateButton");

    let drawing = false;
    let lastX = 0;
    let lastY = 0;

    let traceCount = 0;
    let totalMovement = 0;

    let width = 0;
    let height = 0;

    function resizeCanvas() {

        const ratio = Math.min(window.devicePixelRatio || 1, 2);

        width = window.innerWidth;
        height = window.innerHeight;

        canvas.width = width * ratio;
        canvas.height = height * ratio;

        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        ctx.setTransform(ratio, 0, 0, ratio, 0, 0);

        ctx.lineCap = "round";
        ctx.lineJoin = "round";
    }

    resizeCanvas();
    window.addEventListener("resize", resizeCanvas);

    function updateCounter() {

        counter.textContent =
            String(Math.min(traceCount, 9999))
            .padStart(4, "0");
    }

    function drawPoint(x, y, previousX, previousY) {

        const dx = x - previousX;
        const dy = y - previousY;

        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < 0.5) {
            return;
        }

        totalMovement += distance;

        /*
         * This is the first small algorithmic intervention.
         * The line does not exactly follow the gesture.
         * Its position is subtly displaced according to
         * movement and a sine-based variation.
         */

        const angle = Math.atan2(dy, dx);

        const variation =
            Math.sin(totalMovement * 0.035) *
            Math.min(distance * 0.22, 7);

        const offsetX =
            Math.cos(angle + Math.PI / 2) * variation;

        const offsetY =
            Math.sin(angle + Math.PI / 2) * variation;

        const finalX = x + offsetX;
        const finalY = y + offsetY;

        const speed = Math.min(distance, 25);

        ctx.beginPath();

        ctx.moveTo(
            previousX,
            previousY
        );

        ctx.lineTo(
            finalX,
            finalY
        );

        /*
         * Faster gestures become slightly thinner.
         * Slower gestures remain more substantial.
         */

        ctx.lineWidth =
            Math.max(
                0.8,
                2.6 - speed * 0.045
            );

        ctx.strokeStyle = "#111";

        ctx.stroke();

        traceCount++;
        updateCounter();
    }

    function startDrawing(event) {

        drawing = true;

        const rect = canvas.getBoundingClientRect();

        lastX = event.clientX - rect.left;
        lastY = event.clientY - rect.top;

        intro.classList.add("hidden");
        instruction.classList.add("hidden");
        galleryLink.classList.remove("visible");

        canvas.setPointerCapture(event.pointerId);
    }

    function draw(event) {

        if (!drawing) {
            return;
        }

        const rect = canvas.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        drawPoint(
            x,
            y,
            lastX,
            lastY
        );

        lastX = x;
        lastY = y;
    }

    function stopDrawing() {

        if (!drawing) {
            return;
        }

        drawing = false;

        /*
         * The trace is finished.
         * Later we will let the algorithm
         * continue transforming it here.
         */

        if (traceCount > 10) {
            galleryLink.classList.add("visible");
        }
    }

    canvas.addEventListener(
        "pointerdown",
        startDrawing
    );

    canvas.addEventListener(
        "pointermove",
        draw
    );

    canvas.addEventListener(
        "pointerup",
        stopDrawing
    );

    canvas.addEventListener(
        "pointercancel",
        stopDrawing
    );

    clearButton.addEventListener(
        "click",
        () => {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );

            traceCount = 0;
            totalMovement = 0;

            updateCounter();

            intro.classList.remove("hidden");
            instruction.classList.remove("hidden");
            galleryLink.classList.remove("visible");
        }
    );

    generateButton.addEventListener(
        "click",
        () => {

            intro.classList.add("hidden");
            instruction.classList.add("hidden");

            let x = width * 0.2 + Math.random() * width * 0.6;
            let y = height * 0.2 + Math.random() * height * 0.6;

            let previousX = x;
            let previousY = y;

            const points = 100 + Math.floor(Math.random() * 100);

            for (let i = 0; i < points; i++) {

                const angle =
                    Math.random() * Math.PI * 2;

                const distance =
                    4 + Math.random() * 18;

                x += Math.cos(angle) * distance;
                y += Math.sin(angle) * distance;

                x = Math.max(0, Math.min(width, x));
                y = Math.max(0, Math.min(height, y));

                drawPoint(
                    x,
                    y,
                    previousX,
                    previousY
                );

                previousX = x;
                previousY = y;
            }

            galleryLink.classList.add("visible");
        }
    );

})();
</script>

</body>
</html>
