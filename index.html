<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TRACE — Algorithmic Gesture</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --paper: #f4f2ed;
  --ink: #111111;
  --muted: #77736d;
  --line: rgba(17,17,17,.18);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  position: relative;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  touch-action: none;
}

header {
  position: fixed;
  z-index: 20;
  top: 0;
  left: 0;
  right: 0;
  height: 82px;
  padding: 27px 38px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  pointer-events: none;
}

.logo {
  font-size: 24px;
  letter-spacing: .18em;
  font-weight: 400;
}

.counter {
  font-family: "Courier New", monospace;
  font-size: 15px;
  letter-spacing: .18em;
  color: var(--muted);
}

.intro {
  position: fixed;
  z-index: 10;
  left: 50%;
  top: 47%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  transition: opacity .8s ease, transform .8s ease;
}

.intro.hidden {
  opacity: 0;
  transform: translate(-50%, -54%);
}

.title {
  font-size: clamp(82px, 18vw, 180px);
  line-height: .8;
  letter-spacing: -.07em;
  font-weight: 500;
}

.subtitle {
  margin-top: 35px;
  font-family: "Courier New", monospace;
  font-size: 13px;
  letter-spacing: .38em;
  color: #8b8781;
  text-transform: uppercase;
}

.instruction {
  position: fixed;
  z-index: 15;
  left: 38px;
  bottom: 45px;
  color: var(--muted);
  font-size: 16px;
  line-height: 1.65;
  pointer-events: none;
}

.controls {
  position: fixed;
  z-index: 20;
  right: 38px;
  bottom: 38px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

button {
  border: 1px solid rgba(17,17,17,.28);
  background: rgba(244,242,237,.82);
  backdrop-filter: blur(8px);
  color: #55514c;
  min-width: 184px;
  padding: 17px 25px;
  font-family: "Courier New", monospace;
  font-size: 13px;
  letter-spacing: .2em;
  cursor: pointer;
  transition: .25s ease;
}

button:hover {
  background: #111;
  color: #fff;
  border-color: #111;
}

button.primary {
  background: #111;
  color: #fff;
  border-color: #111;
}

button.primary:hover {
  background: #333;
}

.navigation {
  position: fixed;
  z-index: 30;
  top: 91px;
  left: 38px;
  display: flex;
  gap: 22px;
}

.nav-button {
  min-width: auto;
  padding: 8px 0;
  border: none;
  background: transparent;
  backdrop-filter: none;
  color: #99948d;
  font-size: 11px;
  letter-spacing: .22em;
}

.nav-button.active {
  color: #111;
}

.gallery {
  position: fixed;
  z-index: 12;
  inset: 125px 30px 30px;
  overflow-y: auto;
  padding: 10px 8px 80px;
  display: none;
  scrollbar-width: thin;
}

.gallery.visible {
  display: block;
}

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 24px;
}

.gallery-item {
  position: relative;
  background: rgba(255,255,255,.32);
  border: 1px solid rgba(17,17,17,.12);
  padding: 10px;
  animation: appear .5s ease both;
}

.gallery-item canvas {
  position: relative;
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  background: var(--paper);
}

.gallery-meta {
  display: flex;
  justify-content: space-between;
  padding: 12px 3px 3px;
  font-family: "Courier New", monospace;
  font-size: 10px;
  letter-spacing: .14em;
  color: #77736d;
  text-transform: uppercase;
}

.empty {
  width: 100%;
  text-align: center;
  margin-top: 25vh;
  font-family: "Courier New", monospace;
  font-size: 12px;
  line-height: 2;
  letter-spacing: .15em;
  color: #99948d;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {

  header {
    padding: 24px 22px;
    height: 70px;
  }

  .logo {
    font-size: 21px;
  }

  .counter {
    font-size: 13px;
  }

  .intro {
    width: 100%;
  }

  .title {
    font-size: 82px;
  }

  .subtitle {
    font-size: 10px;
    letter-spacing: .27em;
    margin-top: 27px;
  }

  .instruction {
    left: 22px;
    bottom: 28px;
    font-size: 13px;
    max-width: 235px;
  }

  .controls {
    right: 22px;
    bottom: 25px;
  }

  button {
    min-width: 140px;
    padding: 14px 15px;
    font-size: 11px;
  }

  .navigation {
    top: 75px;
    left: 22px;
  }

  .gallery {
    inset: 108px 15px 15px;
  }

  .gallery-grid {
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .gallery-meta {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<header>
  <div class="logo">TRACE</div>
  <div class="counter" id="counter">0000</div>
</header>

<nav class="navigation">
  <button class="nav-button active" id="createTab">CREATE</button>
  <button class="nav-button" id="galleryTab">GALLERY</button>
</nav>

<section class="intro" id="intro">
  <div class="title">TRACE</div>
  <div class="subtitle">GESTURE / ALGORITHM / LINE</div>
</section>

<div class="instruction" id="instruction">
  Move across the surface.<br>
  Your gesture becomes a trace.
</div>

<div class="controls" id="controls">
  <button class="primary" id="clearButton">CLEAR</button>
  <button id="generateButton">GENERATE</button>
</div>

<section class="gallery" id="gallery">
  <div class="gallery-grid" id="galleryGrid"></div>
  <div class="empty" id="emptyGallery">
    NO TRACES YET<br><br>
    CREATE A GESTURE TO BEGIN
  </div>
</section>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const intro = document.getElementById("intro");
const instruction = document.getElementById("instruction");
const counter = document.getElementById("counter");

const clearButton = document.getElementById("clearButton");
const generateButton = document.getElementById("generateButton");

const createTab = document.getElementById("createTab");
const galleryTab = document.getElementById("galleryTab");

const controls = document.getElementById("controls");
const gallery = document.getElementById("gallery");
const galleryGrid = document.getElementById("galleryGrid");
const emptyGallery = document.getElementById("emptyGallery");

let dpr = Math.min(window.devicePixelRatio || 1, 2);

let drawing = false;
let points = [];
let totalMarks = 0;
let gestureNumber = 0;

let hue = Math.random() * 360;
let lastPoint = null;
let lastTime = 0;
let gestureStarted = false;

const paper = "#f4f2ed";

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;

  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);

function clearCanvas(save = false) {

  ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

  if (save && points.length > 5) {
    saveGesture();
  }

  points = [];
  lastPoint = null;
  drawing = false;

  updateCounter();

  intro.classList.remove("hidden");
  instruction.style.opacity = "1";
}

function updateCounter() {
  counter.textContent = String(totalMarks).padStart(4, "0");
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function getPoint(event) {

  const rect = canvas.getBoundingClientRect();

  return {
    x: event.clientX - rect.left,
    y: event.clientY - rect.top,
    time: performance.now()
  };
}

function startGesture(event) {

  if (gallery.classList.contains("visible")) return;

  drawing = true;
  gestureStarted = true;

  intro.classList.add("hidden");
  instruction.style.opacity = "0";

  const p = getPoint(event);

  points = [p];
  lastPoint = p;
  lastTime = p.time;

  hue = (hue + 47 + Math.random() * 80) % 360;

  canvas.setPointerCapture?.(event.pointerId);
}

function drawGesture(event) {

  if (!drawing) return;

  const p = getPoint(event);

  const prev = lastPoint;
  const dt = Math.max(8, p.time - lastTime);

  const dx = p.x - prev.x;
  const dy = p.y - prev.y;

  const speed = Math.min(3, Math.hypot(dx, dy) / dt * 10);

  const angle = Math.atan2(dy, dx);

  const wiggle =
    Math.sin(points.length * 0.22 + hue) *
    (1.5 + speed * 3);

  const nx = -Math.sin(angle);
  const ny = Math.cos(angle);

  const ax = p.x + nx * wiggle;
  const ay = p.y + ny * wiggle;

  const width =
    Math.max(
      .8,
      Math.min(
        8,
        1.1 + speed * 2.2 + Math.sin(points.length * .08) * .7
      )
    );

  const colorShift =
    Math.sin(points.length * .045) * 24;

  const color =
    `hsl(${(hue + colorShift + 360) % 360}, 72%, 48%)`;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  // Main algorithmic line
  ctx.beginPath();
  ctx.moveTo(prev.x, prev.y);
  ctx.quadraticCurveTo(ax, ay, p.x, p.y);

  ctx.strokeStyle = color;
  ctx.globalAlpha = .78;
  ctx.lineWidth = width;
  ctx.stroke();

  // Secondary echo
  const echo =
    3 +
    Math.sin(points.length * .13) * 3 +
    speed * 2;

  ctx.beginPath();
  ctx.moveTo(prev.x + nx * echo, prev.y + ny * echo);
  ctx.quadraticCurveTo(
    ax + nx * echo * 1.5,
    ay + ny * echo * 1.5,
    p.x + nx * echo,
    p.y + ny * echo
  );

  ctx.globalAlpha = .20;
  ctx.lineWidth = Math.max(.5, width * .45);
  ctx.stroke();

  // Random algorithmic fragments
  if (Math.random() < .075) {

    const length = 5 + Math.random() * 18;
    const offset = (Math.random() - .5) * 12;

    ctx.beginPath();

    ctx.moveTo(
      p.x + nx * offset,
      p.y + ny * offset
    );

    ctx.lineTo(
      p.x + nx * offset + Math.cos(angle) * length,
      p.y + ny * offset + Math.sin(angle) * length
    );

    ctx.globalAlpha = .35;
    ctx.lineWidth = Math.max(.5, width * .55);
    ctx.stroke();
  }

  ctx.globalAlpha = 1;

  points.push({
    x: p.x,
    y: p.y,
    time: p.time,
    speed
  });

  totalMarks++;
  updateCounter();

  lastPoint = p;
  lastTime = p.time;
}

function endGesture(event) {

  if (!drawing) return;

  drawing = false;

  try {
    canvas.releasePointerCapture?.(event.pointerId);
  } catch(e) {}

  if (points.length > 8) {
    saveGesture();
  }

  gestureStarted = false;
}

canvas.addEventListener("pointerdown", startGesture);
canvas.addEventListener("pointermove", drawGesture);
canvas.addEventListener("pointerup", endGesture);
canvas.addEventListener("pointercancel", endGesture);

function generate() {

  if (gallery.classList.contains("visible")) return;

  intro.classList.add("hidden");
  instruction.style.opacity = "0";

  const margin = 90;

  let x = margin + Math.random() * (window.innerWidth - margin * 2);
  let y = margin + Math.random() * (window.innerHeight - margin * 2);

  let angle = Math.random() * Math.PI * 2;

  const count = 100 + Math.floor(Math.random() * 130);

  hue = Math.random() * 360;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  for (let i = 0; i < count; i++) {

    const oldX = x;
    const oldY = y;

    angle +=
      (Math.random() - .5) * .38 +
      Math.sin(i * .08) * .025;

    const step =
      3 +
      Math.random() * 7;

    x += Math.cos(angle) * step;
    y += Math.sin(angle) * step;

    if (x < margin || x > window.innerWidth - margin) {
      angle = Math.PI - angle;
    }

    if (y < margin || y > window.innerHeight - margin) {
      angle = -angle;
    }

    const color =
      `hsl(${(hue + i * .9) % 360}, 72%, 48%)`;

    ctx.beginPath();
    ctx.moveTo(oldX, oldY);
    ctx.quadraticCurveTo(
      (oldX + x) / 2 + (Math.random() - .5) * 15,
      (oldY + y) / 2 + (Math.random() - .5) * 15,
      x,
      y
    );

    ctx.strokeStyle = color;
    ctx.globalAlpha = .65;
    ctx.lineWidth = 1 + Math.random() * 3;
    ctx.stroke();

    totalMarks++;
  }

  ctx.globalAlpha = 1;
  updateCounter();

  setTimeout(saveGenerated, 250);
}

function saveGenerated() {

  const image = canvas.toDataURL("image/png");

  const gallery = getGallery();

  gestureNumber++;

  gallery.unshift({
    id: gestureNumber,
    image: image,
    type: "generated"
  });

  saveGallery(gallery);
}

function saveGesture() {

  if (points.length < 8) return;

  const image = canvas.toDataURL("image/png");

  const galleryData = getGallery();

  gestureNumber++;

  galleryData.unshift({
    id: gestureNumber,
    image: image,
    type: "gesture"
  });

  saveGallery(galleryData);
}

function getGallery() {

  try {
    return JSON.parse(
      localStorage.getItem("trace-gallery") || "[]"
    );
  } catch(e) {
    return [];
  }
}

function saveGallery(data) {

  // Keep the gallery reasonably small.
  const limited = data.slice(0, 30);

  try {
    localStorage.setItem(
      "trace-gallery",
      JSON.stringify(limited)
    );
  } catch(e) {}

  renderGallery();
}

function renderGallery() {

  const items = getGallery();

  galleryGrid.innerHTML = "";

  emptyGallery.style.display =
    items.length ? "none" : "block";

  items.forEach(item => {

    const wrapper = document.createElement("div");
    wrapper.className = "gallery-item";

    const img = document.createElement("img");

    img.src = item.image;
    img.style.width = "100%";
    img.style.display = "block";
    img.style.aspectRatio = "1 / 1";
    img.style.objectFit = "cover";
    img.style.background = paper;

    const meta = document.createElement("div");
    meta.className = "gallery-meta";

    meta.innerHTML = `
      <span>TRACE ${String(item.id).padStart(4,"0")}</span>
      <span>${item.type}</span>
    `;

    wrapper.appendChild(img);
    wrapper.appendChild(meta);

    galleryGrid.appendChild(wrapper);
  });
}

function showCreate() {

  gallery.classList.remove("visible");

  canvas.style.display = "block";
  controls.style.display = "flex";
  intro.style.display = "block";
  instruction.style.display = "block";

  createTab.classList.add("active");
  galleryTab.classList.remove("active");
}

function showGallery() {

  gallery.classList.add("visible");

  canvas.style.display = "none";
  controls.style.display = "none";
  intro.style.display = "none";
  instruction.style.display = "none";

  createTab.classList.remove("active");
  galleryTab.classList.add("active");

  renderGallery();
}

createTab.addEventListener("click", showCreate);
galleryTab.addEventListener("click", showGallery);

clearButton.addEventListener("click", () => {
  clearCanvas(false);
});

generateButton.addEventListener("click", generate);

renderGallery();

</script>

</body>
</html>
