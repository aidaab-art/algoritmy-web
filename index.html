<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRACE — Gesture / Algorithm / Line</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --paper:#f5f3ee;
  --ink:#111;
  --soft:#77736d;
  --border:rgba(17,17,17,.16);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* HEADER */

header{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:28px 34px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.brand,
nav,
.modebar{
  pointer-events:auto;
}

.brand h1{
  font-size:15px;
  font-weight:500;
  letter-spacing:.28em;
}

.brand p{
  margin-top:7px;
  font-size:9px;
  letter-spacing:.2em;
  color:var(--soft);
}

nav{
  display:flex;
  gap:26px;
}

.nav-btn{
  position:relative;
  border:0;
  background:none;
  color:var(--ink);
  padding:3px 0;
  font-size:10px;
  letter-spacing:.18em;
}

.nav-btn:after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:1px;
  background:currentColor;
  transition:.3s;
}

.nav-btn.active:after,
.nav-btn:hover:after{
  width:100%;
}

.counter{
  position:fixed;
  z-index:20;
  right:34px;
  top:91px;
  color:var(--soft);
  font-size:9px;
  letter-spacing:.18em;
}

/* MODES */

.modebar{
  position:fixed;
  z-index:20;
  left:50%;
  top:91px;
  transform:translateX(-50%);
  display:flex;
  gap:18px;
}

.mode-btn{
  position:relative;
  border:0;
  background:none;
  color:var(--soft);
  padding:3px 0;
  font-size:8px;
  letter-spacing:.16em;
}

.mode-btn.active{
  color:var(--ink);
}

.mode-btn.active:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-5px;
  height:1px;
  background:var(--ink);
}

/* INTRO */

.intro{
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  transition:.8s ease;
}

.intro.hidden{
  opacity:0;
  transform:translate(-50%,-47%);
}

.intro h2{
  font-size:clamp(45px,9vw,110px);
  font-weight:400;
  letter-spacing:.08em;
  line-height:.9;
}

.intro p{
  margin-top:28px;
  color:var(--soft);
  font-size:10px;
  letter-spacing:.18em;
  line-height:1.7;
}

/* CONTROLS */

.controls{
  position:fixed;
  z-index:20;
  left:34px;
  right:34px;
  bottom:30px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  pointer-events:none;
}

.control-group{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.action{
  border:1px solid var(--border);
  background:rgba(245,243,238,.84);
  backdrop-filter:blur(8px);
  color:var(--ink);
  padding:11px 16px;
  font-size:9px;
  letter-spacing:.16em;
  transition:.25s;
}

.action:hover{
  background:var(--ink);
  color:var(--paper);
}

.action.primary{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
}

.action:disabled{
  opacity:.35;
  cursor:default;
}

.action:disabled:hover{
  background:rgba(245,243,238,.84);
  color:var(--ink);
}

.save{
  display:none;
  pointer-events:auto;
}

/* GALLERY */

#gallery{
  position:fixed;
  z-index:50;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--paper);
  touch-action:pan-y;
}

.gallery-header{
  padding:28px 34px 20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.gallery-title{
  font-size:15px;
  letter-spacing:.28em;
}

.gallery-subtitle{
  margin-top:7px;
  color:var(--soft);
  font-size:9px;
  letter-spacing:.18em;
}

.close-gallery{
  border:0;
  background:none;
  color:var(--ink);
  font-size:10px;
  letter-spacing:.18em;
}

.gallery-grid{
  padding:35px 34px 80px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:45px 24px;
}

.empty{
  grid-column:1/-1;
  padding:20vh 0;
  text-align:center;
  color:var(--soft);
  font-size:10px;
  letter-spacing:.18em;
}

.card{
  min-width:0;
}

.image-wrap{
  width:100%;
  aspect-ratio:1.45/1;
  overflow:hidden;
  background:#ebe8e0;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.7s;
}

.card:hover img{
  transform:scale(1.025);
}

.info{
  padding-top:13px;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.number{
  margin-bottom:5px;
  color:var(--soft);
  font-size:8px;
  letter-spacing:.16em;
}

.name{
  font-size:12px;
  letter-spacing:.03em;
}

.mode-label{
  margin-top:6px;
  color:var(--soft);
  font-size:7px;
  letter-spacing:.16em;
}

.date{
  color:var(--soft);
  font-size:8px;
  letter-spacing:.08em;
  white-space:nowrap;
  text-align:right;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(17,17,17,.18);
  backdrop-filter:blur(7px);
}

.modal-box{
  width:min(480px,calc(100% - 40px));
  padding:32px;
  background:var(--paper);
  box-shadow:0 25px 80px rgba(0,0,0,.12);
}

.modal-label{
  margin-bottom:12px;
  color:var(--soft);
  font-size:8px;
  letter-spacing:.2em;
}

.modal-box h3{
  margin-bottom:24px;
  font-size:22px;
  font-weight:400;
  letter-spacing:.05em;
}

#titleInput{
  width:100%;
  border:0;
  border-bottom:1px solid var(--ink);
  outline:0;
  background:transparent;
  padding:11px 0;
  color:var(--ink);
  font-size:15px;
}

.modal-actions{
  margin-top:28px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.message{
  min-height:13px;
  margin-top:13px;
  color:#a33;
  font-size:9px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:22px 20px;
  }

  .brand h1{
    font-size:13px;
  }

  .brand p{
    font-size:7px;
  }

  nav{
    gap:15px;
  }

  .nav-btn{
    font-size:8px;
  }

  .counter{
    top:76px;
    right:20px;
    font-size:8px;
  }

  .modebar{
    top:112px;
    gap:14px;
  }

  .mode-btn{
    font-size:7px;
  }

  .intro h2{
    font-size:48px;
  }

  .intro p{
    max-width:270px;
    font-size:8px;
  }

  .controls{
    left:20px;
    right:20px;
    bottom:20px;
  }

  .control-group{
    gap:7px;
  }

  .action{
    padding:10px 12px;
    font-size:8px;
  }

  .gallery-header{
    padding:22px 20px;
  }

  .gallery-grid{
    padding:25px 20px 70px;
    grid-template-columns:1fr;
    gap:35px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas"></canvas>

<header>

  <div class="brand">
    <h1>TRACE</h1>
    <p>GESTURE / ALGORITHM / LINE</p>
  </div>

  <nav>
    <button class="nav-btn active" id="createBtn">CREATE</button>
    <button class="nav-btn" id="galleryBtn">GALLERY</button>
  </nav>

</header>

<div class="modebar">

  <button class="mode-btn active" data-mode="LINE">
    LINE
  </button>

  <button class="mode-btn" data-mode="FIELD">
    FIELD
  </button>

  <button class="mode-btn" data-mode="FRAGMENT">
    FRAGMENT
  </button>

  <button class="mode-btn" data-mode="FLOW">
    FLOW
  </button>

</div>

<div class="counter" id="counter">
  TRACE / 000
</div>

<div class="intro" id="intro">

  <h2>TRACE</h2>

  <p>
    MOVE ACROSS THE SURFACE.<br>
    YOUR GESTURE BECOMES A TRACE.
  </p>

</div>

<div class="controls">

  <div class="control-group">

    <button class="action" id="undoBtn" disabled>
      UNDO
    </button>

    <button class="action" id="clearBtn">
      CLEAR
    </button>

    <button class="action" id="generateBtn">
      GENERATE
    </button>

  </div>

  <button class="action primary save" id="saveBtn">
    SAVE TRACE
  </button>

</div>

</div>


<section id="gallery">

  <div class="gallery-header">

    <div>

      <div class="gallery-title">
        GALLERY
      </div>

      <div class="gallery-subtitle">
        A COLLECTIVE ARCHIVE OF GESTURES
      </div>

    </div>

    <button class="close-gallery" id="closeGallery">
      CLOSE ×
    </button>

  </div>

  <div class="gallery-grid" id="galleryGrid">
    <div class="empty">
      LOADING TRACES…
    </div>
  </div>

</section>


<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-label">
      NEW WORK
    </div>

    <h3>
      Name your trace
    </h3>

    <input
      id="titleInput"
      type="text"
      maxlength="80"
      autocomplete="off"
      spellcheck="false"
    >

    <div class="message" id="message"></div>

    <div class="modal-actions">

      <button class="action" id="cancel">
        CANCEL
      </button>

      <button class="action primary" id="confirm">
        SAVE
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://xmhrmpbqmivbqhhrixvu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9WsX5CWWMeRnBs-sLIYvKA_l_8djSy0";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const intro =
  document.getElementById("intro");

const counter =
  document.getElementById("counter");

const saveBtn =
  document.getElementById("saveBtn");

const undoBtn =
  document.getElementById("undoBtn");

const modal =
  document.getElementById("modal");

const titleInput =
  document.getElementById("titleInput");

const message =
  document.getElementById("message");

const gallery =
  document.getElementById("gallery");

const galleryGrid =
  document.getElementById("galleryGrid");


/* =====================================================
   STATE
===================================================== */

let W = 0;
let H = 0;

let drawing = false;
let hasDrawing = false;

let lastX = 0;
let lastY = 0;
let lastTime = 0;

let strokes = 0;

let hue =
  Math.random()*360;

let currentMode =
  "LINE";


/* =====================================================
   UNDO HISTORY
===================================================== */

let history = [];

const MAX_HISTORY = 30;


function saveHistory(){

  if(!W || !H)
    return;

  const snapshot =
    ctx.getImageData(
      0,
      0,
      canvas.width,
      canvas.height
    );

  history.push({
    imageData:snapshot,
    strokes:strokes,
    hasDrawing:hasDrawing,
    hue:hue
  });

  if(history.length>MAX_HISTORY){
    history.shift();
  }

  updateUndoButton();
}


function updateUndoButton(){

  undoBtn.disabled =
    history.length===0;
}


function undo(){

  if(!history.length)
    return;

  drawing=false;

  const previous =
    history.pop();

  ctx.putImageData(
    previous.imageData,
    0,
    0
  );

  strokes =
    previous.strokes;

  hasDrawing =
    previous.hasDrawing;

  hue =
    previous.hue;

  lastX=0;
  lastY=0;
  lastTime=0;

  if(hasDrawing){

    intro.classList.add(
      "hidden"
    );

    saveBtn.style.display=
      "block";

    counter.textContent=
      "TRACE / "+
      String(strokes)
        .padStart(3,"0");

  }else{

    intro.classList.remove(
      "hidden"
    );

    saveBtn.style.display=
      "none";

    counter.textContent=
      "TRACE / 000";
  }

  updateUndoButton();
}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W =
    window.innerWidth;

  H =
    window.innerHeight;

  canvas.width =
    W*ratio;

  canvas.height =
    H*ratio;

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  history=[];

  clearCanvas(false);
}

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   CLEAR
===================================================== */

function clearCanvas(addHistory=true){

  if(
    addHistory &&
    hasDrawing
  ){

    saveHistory();
  }

  ctx.fillStyle =
    "#f5f3ee";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  hasDrawing =
    false;

  strokes =
    0;

  saveBtn.style.display =
    "none";

  intro.classList.remove(
    "hidden"
  );

  counter.textContent =
    "TRACE / 000";

  updateUndoButton();
}


/* =====================================================
   COLOR
===================================================== */

function color(
  h,
  light=55,
  alpha=.75
){

  return `hsla(
    ${((h%360)+360)%360},
    78%,
    ${light}%,
    ${alpha}
  )`;
}


/* =====================================================
   LINE
===================================================== */

function drawLine(
  x,
  y,
  time
){

  const dx =
    x-lastX;

  const dy =
    y-lastY;

  const distance =
    Math.sqrt(
      dx*dx+dy*dy
    );

  if(distance<1)
    return;

  const dt =
    Math.max(
      time-lastTime,
      1
    );

  const speed =
    distance/dt;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const nx =
    -Math.sin(angle);

  const ny =
    Math.cos(angle);

  const wave =
    Math.sin(
      time*.012+
      distance*.08
    )*
    (
      2+
      Math.min(
        speed*.7,
        10
      )
    );

  const random =
    (
      Math.random()-.5
    )*
    (
      1.5+
      Math.min(
        speed*.25,
        5
      )
    );

  const px =
    x+
    nx*(wave+random);

  const py =
    y+
    ny*(wave+random);

  const currentHue =
    hue+
    angle*45+
    speed*18+
    strokes*4;

  const alpha =
    .5+
    Math.min(
      speed*.025,
      .25
    );

  /* THICKER LINE VARIATION */

  const lineWidth =
    1.2+
    Math.min(
      speed*.75,
      14
    );

  ctx.beginPath();

  ctx.moveTo(
    lastX,
    lastY
  );

  ctx.quadraticCurveTo(
    (lastX+px)/2+
      nx*wave,
    (lastY+py)/2+
      ny*wave,
    px,
    py
  );

  ctx.strokeStyle =
    color(
      currentHue,
      45+
      Math.min(
        speed*2,
        12
      ),
      alpha
    );

  ctx.lineWidth =
    lineWidth;

  ctx.lineCap =
    "round";

  ctx.stroke();


  if(speed>2){

    const echo =
      5+
      Math.min(
        speed*1.1,
        16
      );

    ctx.beginPath();

    ctx.moveTo(
      lastX,
      lastY
    );

    ctx.quadraticCurveTo(
      (lastX+px)/2+
        nx*(wave+echo),
      (lastY+py)/2+
        ny*(wave+echo),
      px+nx*2,
      py+ny*2
    );

    ctx.strokeStyle =
      color(
        currentHue+28,
        58,
        alpha*.27
      );

    ctx.lineWidth =
      Math.max(
        .5,
        lineWidth*.32
      );

    ctx.stroke();
  }

  lastX =
    x;

  lastY =
    y;

  lastTime =
    time;
}


/* =====================================================
   FIELD
===================================================== */

function drawField(
  x,
  y,
  time
){

  const dx =
    x-lastX;

  const dy =
    y-lastY;

  const distance =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(distance<1)
    return;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const speed =
    distance/
    Math.max(
      time-lastTime,
      1
    );

  const amount =
    4+
    Math.floor(
      Math.min(
        speed*3,
        14
      )
    );

  for(
    let i=0;
    i<amount;
    i++
  ){

    const radius =
      5+
      Math.random()*
      (
        12+
        Math.min(
          speed*12,
          35
        )
      );

    const a =
      Math.random()*
      Math.PI*2;

    const px =
      x+
      Math.cos(a)*
      radius;

    const py =
      y+
      Math.sin(a)*
      radius;

    const size =
      .7+
      Math.random()*3.5;

    ctx.beginPath();

    ctx.arc(
      px,
      py,
      size,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      color(
        hue+
        i*18+
        Math.sin(time*.01)*30,
        48+
        Math.random()*18,
        .25+
        Math.random()*.45
      );

    ctx.fill();
  }

  hue+=.4;

  lastX=x;
  lastY=y;
  lastTime=time;
}


/* =====================================================
   FRAGMENT
===================================================== */

function drawFragment(
  x,
  y,
  time
){

  const dx =
    x-lastX;

  const dy =
    y-lastY;

  const distance =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(distance<1)
    return;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const count =
    2+
    Math.floor(
      Math.random()*4
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const offset =
      (
        Math.random()-.5
      )*
      (
        15+
        distance*.5
      );

    const px =
      x-
      Math.cos(angle)*
      offset;

    const py =
      y-
      Math.sin(angle)*
      offset;

    const length =
      3+
      Math.random()*18;

    const size =
      1+
      Math.random()*4;

    const rotation =
      angle+
      (
        Math.random()-.5
      )*
      1.5;

    ctx.save();

    ctx.translate(
      px,
      py
    );

    ctx.rotate(
      rotation
    );

    ctx.fillStyle =
      color(
        hue+
        i*40+
        distance,
        42+
        Math.random()*20,
        .4+
        Math.random()*.5
      );

    ctx.fillRect(
      -length/2,
      -size/2,
      length,
      size
    );

    ctx.restore();
  }

  hue+=
    distance*.3;

  lastX=x;
  lastY=y;
  lastTime=time;
}


/* =====================================================
   FLOW
===================================================== */

function drawFlow(
  x,
  y,
  time
){

  const dx =
    x-lastX;

  const dy =
    y-lastY;

  const distance =
    Math.sqrt(
      dx*dx+
      dy*dy
    );

  if(distance<1)
    return;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const normalX =
    -Math.sin(angle);

  const normalY =
    Math.cos(angle);

  const speed =
    distance/
    Math.max(
      time-lastTime,
      1
    );

  const waves =
    3+
    Math.floor(
      Math.min(
        speed*1.5,
        8
      )
    );

  for(
    let i=0;
    i<waves;
    i++
  ){

    const phase =
      i*.8+
      time*.008;

    const offset =
      Math.sin(
        phase
      )*
      (
        5+
        speed*4
      );

    const bend =
      Math.cos(
        phase*.7
      )*
      8;

    ctx.beginPath();

    ctx.moveTo(
      lastX+
      normalX*offset,
      lastY+
      normalY*offset
    );

    ctx.quadraticCurveTo(

      (lastX+x)/2+
      normalX*(offset+bend),

      (lastY+y)/2+
      normalY*(offset+bend),

      x+
      normalX*(offset*.6),

      y+
      normalY*(offset*.6)
    );

    ctx.strokeStyle =
      color(
        hue+
        i*22+
        time*.015,
        50+
        i*3,
        .18+
        .12*i
      );

    ctx.lineWidth =
      .8+
      i*.65+
      Math.min(
        speed,
        3
      );

    ctx.lineCap =
      "round";

    ctx.stroke();
  }

  hue+=
    .8+
    speed*.4;

  lastX=x;
  lastY=y;
  lastTime=time;
}


/* =====================================================
   MAIN DRAW
===================================================== */

function draw(
  x,
  y,
  time
){

  if(!drawing)
    return;

  if(currentMode==="LINE"){
    drawLine(x,y,time);
  }

  if(currentMode==="FIELD"){
    drawField(x,y,time);
  }

  if(currentMode==="FRAGMENT"){
    drawFragment(x,y,time);
  }

  if(currentMode==="FLOW"){
    drawFlow(x,y,time);
  }

  hasDrawing =
    true;

  intro.classList.add(
    "hidden"
  );

  saveBtn.style.display =
    "block";

  counter.textContent =
    "TRACE / "+
    String(strokes)
      .padStart(3,"0");
}


/* =====================================================
   POINTER
===================================================== */

canvas.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    saveHistory();

    drawing=true;

    canvas.setPointerCapture(
      e.pointerId
    );

    lastX=
      e.clientX;

    lastY=
      e.clientY;

    lastTime=
      performance.now();

    strokes++;

    hue=
      (
        hue+
        35+
        Math.random()*80
      )%360;

    if(
      currentMode==="LINE"
    ){

      ctx.beginPath();

      ctx.arc(
        lastX,
        lastY,
        1.5,
        0,
        Math.PI*2
      );

      ctx.fillStyle =
        color(
          hue,
          50,
          .75
        );

      ctx.fill();
    }

    if(
      currentMode==="FIELD"
    ){

      for(
        let i=0;
        i<20;
        i++
      ){

        const a=
          Math.random()*
          Math.PI*2;

        const r=
          Math.random()*25;

        ctx.beginPath();

        ctx.arc(
          lastX+
            Math.cos(a)*r,
          lastY+
            Math.sin(a)*r,
          1+
            Math.random()*3,
          0,
          Math.PI*2
        );

        ctx.fillStyle=
          color(
            hue+
            i*10,
            55,
            .4
          );

        ctx.fill();
      }
    }

    hasDrawing=true;

    intro.classList.add(
      "hidden"
    );

    saveBtn.style.display=
      "block";

    counter.textContent=
      "TRACE / "+
      String(strokes)
        .padStart(3,"0");
  }
);


canvas.addEventListener(
  "pointermove",
  e=>{

    if(!drawing)
      return;

    e.preventDefault();

    draw(
      e.clientX,
      e.clientY,
      performance.now()
    );
  }
);


function stop(e){

  drawing=false;

  try{
    canvas.releasePointerCapture(
      e.pointerId
    );
  }catch(_){}
}

canvas.addEventListener(
  "pointerup",
  stop
);

canvas.addEventListener(
  "pointercancel",
  stop
);


/* =====================================================
   MODE SWITCHING
===================================================== */

document
  .querySelectorAll(".mode-btn")
  .forEach(
    button=>{

      button.addEventListener(
        "click",
        ()=>{

          currentMode =

          document

            )
            .forEach(

                b.classList.remove(

            );

          button.classList.add(
            "active"
          );

          history=[];

          clearCanvas(false);
        }
      );
    }
  );


/* =====================================================
   GENERATORS
===================================================== */

function generateLine(){

  const count =
    5+
    Math.floor(
      Math.random()*7
    );

  for(
    let s=0;
    s<count;
    s++
  ){

    strokes++;

    let x=
      Math.random()*W;

    let y=
      130+
      Math.random()*
      (
        H-260
      );

    let angle=
      Math.random()*
      Math.PI*2;

    const length=
      120+
      Math.random()*
      Math.min(W,H)*
      .8;

    const steps=
      100+
      Math.floor(
        Math.random()*80
      );

    for(
      let i=0;
      i<steps;
      i++
    ){

      const p=
        i/steps;

      angle+=
        (
          Math.random()-.5
        )*.16;

      const wave=
        Math.sin(
          p*Math.PI*4+s
        )*
        (
          4+
          p*18
        );

      const nx=
        -Math.sin(angle);

      const ny=
        Math.cos(angle);

      const nx2=
        x+
        Math.cos(angle)*
        (
          length/steps
        );

      const ny2=
        y+
        Math.sin(angle)*
        (
          length/steps
        );

      const endX=
        nx2+
        nx*wave;

      const endY=
        ny2+
        ny*wave;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        endX,
        endY
      );

      ctx.strokeStyle=
        color(
          hue+
          s*38+
          p*120,
          45+
          p*12,
          .35+
          p*.4
        );

      /* THICKER GENERATED LINES */

      ctx.lineWidth=
        .9+
        p*5+
        Math.random()*2.2;

      ctx.lineCap=
        "round";

      ctx.stroke();

      x=nx2;
      y=ny2;
    }
  }
}


function generateField(){

  const count=
    450+
    Math.floor(
      Math.random()*500
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const x=
      Math.random()*W;

    const y=
      Math.random()*H;

    const cluster=
      Math.sin(
        x*.012
      )+
      Math.cos(
        y*.009
      );

    const size=
      .6+
      Math.random()*
      (
        1.5+
        Math.abs(cluster)*3
      );

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      color(
        hue+
        cluster*70+
        Math.random()*90,
        45+
        Math.random()*20,
        .18+
        Math.random()*.5
      );

    ctx.fill();
  }
}


function generateFragment(){

  const count=
    180+
    Math.floor(
      Math.random()*180
    );

  for(
    let i=0;
    i<count;
    i++
  ){

    const x=
      Math.random()*W;

    const y=
      Math.random()*H;

    const length=
      3+
      Math.random()*25;

    const size=
      1+
      Math.random()*6;

    const angle=
      Math.random()*
      Math.PI*2;

    ctx.save();

    ctx.translate(
      x,
      y
    );

    ctx.rotate(
      angle
    );

    ctx.fillStyle=
      color(
        hue+
        i*.9,
        42+
        Math.random()*25,
        .3+
        Math.random()*.55
      );

    ctx.fillRect(
      -length/2,
      -size/2,
      length,
      size
    );

    ctx.restore();
  }
}


function generateFlow(){

  const paths=
    9+
    Math.floor(
      Math.random()*8
    );

  for(
    let s=0;
    s<paths;
    s++
  ){

    let x=
      Math.random()*W;

    let y=
      Math.random()*H;

    let angle=
      Math.random()*
      Math.PI*2;

    const steps=
      150+
      Math.floor(
        Math.random()*100
      );

    for(
      let i=0;
      i<steps;
      i++
    ){

      const p=
        i/steps;

      angle+=
        Math.sin(
          i*.045+
          s
        )*.055;

      const speed=
        1+
        Math.sin(
          p*Math.PI
        )*3;

      const nx=
        -Math.sin(angle);

      const ny=
        Math.cos(angle);

      const wave=
        Math.sin(
          i*.09+
          s
        )*
        (
          5+
          p*20
        );

      const nx2=
        x+
        Math.cos(angle)*
        speed;

      const ny2=
        y+
        Math.sin(angle)*
        speed;

      ctx.beginPath();

      ctx.moveTo(
        x+
        nx*wave,
        y+
        ny*wave
      );

      ctx.lineTo(
        nx2+
        nx*wave,
        ny2+
        ny*wave
      );

      ctx.strokeStyle=
        color(
          hue+
          s*25+
          p*100,
          48+
          p*12,
          .18+
          p*.32
        );

      ctx.lineWidth=
        .7+
        p*3;

      ctx.lineCap=
        "round";

      ctx.stroke();

      x=nx2;
      y=ny2;
    }
  }
}


function generate(){

  if(hasDrawing){
    saveHistory();
  }

  clearCanvas(false);

  intro.classList.add(
    "hidden"
  );

  hue=
    Math.random()*360;

  if(currentMode==="LINE"){
    generateLine();
  }

  if(currentMode==="FIELD"){
    generateField();
  }

  if(currentMode==="FRAGMENT"){
    generateFragment();
  }

  if(currentMode==="FLOW"){
    generateFlow();
  }

  hasDrawing=
    true;

  saveBtn.style.display=
    "block";

  counter.textContent=
    "TRACE / "+
    String(strokes)
      .padStart(3,"0");

  updateUndoButton();
}


/* =====================================================
   GALLERY
===================================================== */

async function showGallery(){

  gallery.style.display=
    "block";

  galleryGrid.innerHTML=
    '<div class="empty">LOADING TRACES…</div>';

  const result=
    await db
      .from("traces")
      .select(
        "id,trace_number,title,image_data,created_at,mode"
      )
      .order(
        "trace_number",
        {
          ascending:false
        }
      );

  if(result.error){

    console.error(
      result.error
    );

    galleryGrid.innerHTML=
      '<div class="empty">THE GALLERY COULD NOT BE LOADED.</div>';

    return;
  }

  renderGallery(
    result.data||[]
  );
}


function renderGallery(items){

  galleryGrid.innerHTML="";

  if(!items.length){

    galleryGrid.innerHTML=
      '<div class="empty">NO TRACES YET — BE THE FIRST.</div>';

    return;
  }

  items.forEach(
    item=>{

      const card=
        document.createElement(
          "article"
        );

      card.className=
        "card";


      const wrap=
        document.createElement(
          "div"
        );

      wrap.className=
        "image-wrap";


      const img=
        document.createElement(
          "img"
        );

      img.src=
        item.image_data;

      img.alt=
        item.title;

      img.loading=
        "lazy";


      wrap.appendChild(
        img
      );


      const info=
        document.createElement(
          "div"
        );

      info.className=
        "info";


      const left=
        document.createElement(
          "div"
        );


      const number=
        document.createElement(
          "div"
        );

      number.className=
        "number";

      number.textContent=
        "TRACE "+
        String(
          item.trace_number
        ).padStart(
          3,
          "0"
        );


      const name=
        document.createElement(
          "div"
        );

      name.className=
        "name";

      name.textContent=
        item.title;


      const mode=
        document.createElement(
          "div"
        );

      mode.className=
        "mode-label";

      mode.textContent=
        item.mode||
        "LINE";


      left.appendChild(
        number
      );

      left.appendChild(
        name
      );

      left.appendChild(
        mode
      );


      const date=
        document.createElement(
          "div"
        );

      date.className=
        "date";

      date.textContent=
        new Date(
          item.created_at
        ).toLocaleDateString(
          "en-GB",
          {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
          }
        );


      info.appendChild(
        left
      );

      info.appendChild(
        date
      );


      card.appendChild(
        wrap
      );

      card.appendChild(
        info
      );

      galleryGrid.appendChild(
        card
      );
    }
  );
}


/* =====================================================
   SAVE
===================================================== */

async function openSave(){

  if(!hasDrawing)
    return;

  message.textContent="";

  titleInput.value=
    "TRACE 001";

  modal.style.display=
    "flex";

  setTimeout(
    ()=>{
      titleInput.focus();
      titleInput.select();
    },
    100
  );


  const result=
    await db
      .from("traces")
      .select("trace_number")
      .order(
        "trace_number",
        {
          ascending:false
        }
      )
      .limit(1);


  if(
    !result.error&&
    result.data&&
    result.data.length
  ){

    const next=
      Number(
        result.data[0]
          .trace_number
      )+1;

    if(
      titleInput.value===
      "TRACE 001"
    ){

      titleInput.value=
        "TRACE "+
        String(next)
          .padStart(
            3,
            "0"
          );
    }
  }
}


/* =====================================================
   SAVE ARTWORK
===================================================== */

async function saveArtwork(){

  const title=
    titleInput.value.trim();

  if(!title){

    message.textContent=
      "PLEASE ENTER A NAME.";

    return;
  }

  message.textContent=
    "SAVING…";


  const image=
    canvas.toDataURL(
      "image/jpeg",
      .88
    );


  const result=
    await db
      .from("traces")
      .insert({
        title:title,
        image_data:image,
        mode:currentMode
      })
      .select(
        "id,trace_number,title,created_at,mode"
      )
      .single();


  if(result.error){

    console.error(
      result.error
    );

    message.textContent=
      "COULD NOT SAVE THE TRACE.";

    return;
  }


  message.textContent=
    "SAVED.";


  setTimeout(
    ()=>{

      modal.style.display=
        "none";

      saveBtn.style.display=
        "none";

      showGallery();

      document
        .getElementById(
          "galleryBtn"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "createBtn"
        )
        .classList.remove(
          "active"
        );

    },
    500
  );
}

resize();
