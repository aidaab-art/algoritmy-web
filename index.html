<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>TRACE — Gesture / Algorithm / Line</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --paper: #f5f3ee;
  --ink: #111111;
  --soft: #77736d;
  --line: rgba(17,17,17,.15);
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
}

body {
  touch-action: none;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

/* MAIN */

#app {
  position: fixed;
  inset: 0;
  background: var(--paper);
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* HEADER */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 82px;
  padding: 28px 34px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  z-index: 20;
  pointer-events: none;
}

.brand {
  pointer-events: auto;
}

.brand h1 {
  font-size: 15px;
  letter-spacing: .28em;
  font-weight: 500;
}

.brand p {
  margin-top: 6px;
  font-size: 9px;
  letter-spacing: .2em;
  color: var(--soft);
}

nav {
  display: flex;
  gap: 25px;
  pointer-events: auto;
}

.nav-btn {
  border: 0;
  background: none;
  color: var(--ink);
  font-size: 10px;
  letter-spacing: .18em;
  padding: 3px 0;
  position: relative;
}

.nav-btn::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -5px;
  width: 0;
  height: 1px;
  background: currentColor;
  transition: width .3s ease;
}

.nav-btn:hover::after,
.nav-btn.active::after {
  width: 100%;
}

.counter {
  position: fixed;
  right: 34px;
  top: 91px;
  z-index: 20;
  font-size: 9px;
  letter-spacing: .18em;
  color: var(--soft);
}

/* INTRO */

.intro {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  z-index: 10;
  pointer-events: none;
  transition:
    opacity .8s ease,
    transform .8s ease;
}

.intro.hidden {
  opacity: 0;
  transform: translate(-50%, -47%);
}

.intro h2 {
  font-size: clamp(42px, 9vw, 110px);
  font-weight: 400;
  letter-spacing: .08em;
  line-height: .9;
}

.intro p {
  margin-top: 28px;
  font-size: 10px;
  letter-spacing: .18em;
  color: var(--soft);
}

/* CONTROLS */

.controls {
  position: fixed;
  bottom: 30px;
  left: 34px;
  right: 34px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  z-index: 20;
  pointer-events: none;
}

.control-group {
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.action {
  border: 1px solid var(--line);
  background: rgba(245,243,238,.82);
  backdrop-filter: blur(8px);
  padding: 11px 16px;
  font-size: 9px;
  letter-spacing: .16em;
  color: var(--ink);
  transition: all .25s ease;
}

.action:hover {
  background: var(--ink);
  color: var(--paper);
}

.action.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.action.primary:hover {
  opacity: .72;
}

.action.save {
  display: none;
}

/* GALLERY */

#gallery {
  position: fixed;
  inset: 0;
  z-index: 50;
  background: var(--paper);
  overflow-y: auto;
  overflow-x: hidden;
  display: none;
  touch-action: pan-y;
}

.gallery-header {
  padding: 28px 34px 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.gallery-title {
  font-size: 15px;
  letter-spacing: .28em;
  font-weight: 500;
}

.gallery-subtitle {
  margin-top: 7px;
  font-size: 9px;
  letter-spacing: .18em;
  color: var(--soft);
}

.close-gallery {
  border: 0;
  background: none;
  font-size: 10px;
  letter-spacing: .18em;
}

.gallery-grid {
  padding: 35px 34px 80px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 45px 24px;
}

.empty-gallery {
  grid-column: 1 / -1;
  text-align: center;
  padding: 20vh 0;
  color: var(--soft);
  font-size: 10px;
  letter-spacing: .18em;
}

.trace-card {
  min-width: 0;
}

.trace-image-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 1.45 / 1;
  overflow: hidden;
  background: #ebe8e0;
}

.trace-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .7s ease;
}

.trace-card:hover .trace-image {
  transform: scale(1.025);
}

.trace-info {
  padding-top: 13px;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  align-items: flex-start;
}

.trace-number {
  font-size: 8px;
  letter-spacing: .16em;
  color: var(--soft);
  margin-bottom: 5px;
}

.trace-name {
  font-size: 12px;
  letter-spacing: .03em;
}

.trace-date {
  font-size: 8px;
  color: var(--soft);
  letter-spacing: .08em;
  text-align: right;
  white-space: nowrap;
}

/* MODAL */

.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(17,17,17,.18);
  backdrop-filter: blur(7px);
}

.modal-box {
  width: min(480px, calc(100% - 40px));
  background: var(--paper);
  padding: 32px;
  box-shadow: 0 25px 80px rgba(0,0,0,.12);
}

.modal-label {
  font-size: 8px;
  letter-spacing: .2em;
  color: var(--soft);
  margin-bottom: 12px;
}

.modal-box h3 {
  font-size: 22px;
  font-weight: 400;
  letter-spacing: .05em;
  margin-bottom: 24px;
}

#titleInput {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--ink);
  background: transparent;
  padding: 11px 0;
  outline: none;
  font-size: 15px;
  color: var(--ink);
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 28px;
}

.modal-message {
  margin-top: 14px;
  font-size: 9px;
  color: #a33;
  min-height: 12px;
}

/* MOBILE */

@media (max-width: 700px) {

  header {
    padding: 22px 20px;
    height: 70px;
  }

  .brand h1 {
    font-size: 13px;
  }

  .brand p {
    font-size: 7px;
  }

  nav {
    gap: 15px;
  }

  .nav-btn {
    font-size: 8px;
  }

  .counter {
    right: 20px;
    top: 76px;
    font-size: 8px;
  }

  .intro h2 {
    font-size: 48px;
  }

  .intro p {
    font-size: 8px;
    max-width: 250px;
    line-height: 1.7;
  }

  .controls {
    left: 20px;
    right: 20px;
    bottom: 20px;
  }

  .action {
    padding: 10px 12px;
    font-size: 8px;
  }

  .gallery-header {
    padding: 22px 20px;
  }

  .gallery-grid {
    padding: 25px 20px 70px;
    grid-template-columns: 1fr;
    gap: 35px;
  }

  .trace-info {
    padding-top: 11px;
  }
}
</style>
</head>

<body>

<div id="app">

  <canvas id="canvas"></canvas>

  <header>

    <div class="brand">
      <h1>TRACE</h1>
      <p>GESTURE / ALGORITHM / LINE</p>
    </div>

    <nav>
      <button class="nav-btn active" id="createBtn">
        CREATE
      </button>

      <button class="nav-btn" id="galleryBtn">
        GALLERY
      </button>
    </nav>

  </header>

  <div class="counter" id="counter">
    TRACE / 000
  </div>

  <div class="intro" id="intro">

    <h2>TRACE</h2>

    <p>
      MOVE ACROSS THE SURFACE.<br>
      YOUR GESTURE BECOMES A TRACE.
    </p>

  </div>

  <div class="controls">

    <div class="control-group">

      <button class="action" id="clearBtn">
        CLEAR
      </button>

      <button class="action" id="generateBtn">
        GENERATE
      </button>

    </div>

    <button class="action primary save" id="saveBtn">
      SAVE TRACE
    </button>

  </div>

</div>


<!-- GALLERY -->

<section id="gallery">

  <div class="gallery-header">

    <div>

      <div class="gallery-title">
        GALLERY
      </div>

      <div class="gallery-subtitle">
        A COLLECTIVE ARCHIVE OF GESTURES
      </div>

    </div>

    <button class="close-gallery" id="closeGallery">
      CLOSE ×
    </button>

  </div>

  <div class="gallery-grid" id="galleryGrid">

    <div class="empty-gallery">
      LOADING TRACES…
    </div>

  </div>

</section>


<!-- SAVE MODAL -->

<div class="modal" id="saveModal">

  <div class="modal-box">

    <div class="modal-label">
      NEW WORK
    </div>

    <h3>
      Name your trace
    </h3>

    <input
      id="titleInput"
      type="text"
      maxlength="80"
      autocomplete="off"
      spellcheck="false"
    >

    <div
      class="modal-message"
      id="modalMessage">
    </div>

    <div class="modal-actions">

      <button class="action" id="cancelSave">
        CANCEL
      </button>

      <button class="action primary" id="confirmSave">
        SAVE
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://xmhrmpbqmivbqhhrixvu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9WsX5CWWMeRnBs-sLIYvKA_l_8djSy0";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =========================================================
   CANVAS
========================================================= */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

let width = 0;
let height = 0;

let drawing = false;
let hasDrawing = false;

let lastX = 0;
let lastY = 0;
let lastTime = 0;

let strokePoints = [];
let strokeCount = 0;

let hueBase =
  Math.random() * 360;

const intro =
  document.getElementById("intro");

const saveBtn =
  document.getElementById("saveBtn");

const counter =
  document.getElementById("counter");


function resizeCanvas() {

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  width =
    window.innerWidth;

  height =
    window.innerHeight;

  canvas.width =
    width * ratio;

  canvas.height =
    height * ratio;

  canvas.style.width =
    width + "px";

  canvas.style.height =
    height + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  ctx.fillStyle =
    "#f5f3ee";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );
}


resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================================================
   CLEAR
========================================================= */

function clearCanvas() {

  ctx.fillStyle =
    "#f5f3ee";

  ctx.fillRect(
    0,
    0,
    width,
    height
  );

  hasDrawing = false;

  strokeCount = 0;

  strokePoints = [];

  saveBtn.style.display =
    "none";

  intro.classList.remove(
    "hidden"
  );

  counter.textContent =
    "TRACE / 000";
}


/* =========================================================
   ALGORITHMIC DRAWING
========================================================= */

function drawGesture(
  x,
  y,
  time
) {

  if (!drawing) return;

  const dx =
    x - lastX;

  const dy =
    y - lastY;

  const distance =
    Math.sqrt(
      dx * dx +
      dy * dy
    );

  if (distance < 1) return;

  const dt =
    Math.max(
      time - lastTime,
      1
    );

  const speed =
    distance / dt;

  const angle =
    Math.atan2(
      dy,
      dx
    );

  const normalX =
    -Math.sin(angle);

  const normalY =
    Math.cos(angle);

  const wave =
    Math.sin(
      time * 0.012 +
      distance * 0.08
    ) *
    (
      2 +
      Math.min(
        speed * 0.7,
        10
      )
    );

  const random =
    (
      Math.random() - 0.5
    ) *
    (
      1.5 +
      Math.min(
        speed * 0.25,
        5
      )
    );

  const bendX =
    normalX *
    (
      wave + random
    );

  const bendY =
    normalY *
    (
      wave + random
    );

  const drawX =
    x + bendX;

  const drawY =
    y + bendY;

  const hue =
    (
      hueBase +
      angle * 45 +
      speed * 18 +
      strokeCount * 3
    ) % 360;

  const saturation =
    72 +
    Math.min(
      speed * 3,
      20
    );

  const lightness =
    42 +
    Math.min(
      speed * 2,
      15
    );

  const alpha =
    0.48 +
    Math.min(
      speed * 0.025,
      0.28
    );

  const lineWidth =
    1.2 +
    Math.min(
      speed * 0.18,
      5
    );

  ctx.beginPath();

  ctx.moveTo(
    lastX,
    lastY
  );

  ctx.quadraticCurveTo(

    (lastX + drawX) / 2 +
    normalX * wave,

    (lastY + drawY) / 2 +
    normalY * wave,

    drawX,
    drawY
  );

  ctx.strokeStyle =
    `hsla(
      ${hue},
      ${saturation}%,
      ${lightness}%,
      ${alpha}
    )`;

  ctx.lineWidth =
    lineWidth;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.stroke();


  /* ALGORITHMIC ECHO */

  if (speed > 2) {

    const echo =
      5 +
      Math.min(
        speed * 0.8,
        12
      );

    ctx.beginPath();

    ctx.moveTo(
      lastX,
      lastY
    );

    ctx.quadraticCurveTo(

      (lastX + drawX) / 2 +
      normalX *
      (wave + echo),

      (lastY + drawY) / 2 +
      normalY *
      (wave + echo),

      drawX +
      normalX * 2,

      drawY +
      normalY * 2
    );

    ctx.strokeStyle =
      `hsla(
        ${(hue + 25) % 360},
        80%,
        55%,
        ${alpha * .28}
      )`;

    ctx.lineWidth =
      Math.max(
        .5,
        lineWidth * .45
      );

    ctx.stroke();
  }


  strokePoints.push({

    x: drawX,
    y: drawY,
    speed: speed,
    angle: angle,
    time: time

  });


  lastX = x;
  lastY = y;
  lastTime = time;

  hasDrawing = true;

  intro.classList.add(
    "hidden"
  );

  saveBtn.style.display =
    "block";

  counter.textContent =
    "TRACE / " +
    String(strokeCount)
      .padStart(3, "0");
}


/* =========================================================
   POINTER EVENTS
========================================================= */

canvas.addEventListener(
  "pointerdown",
  function(e) {

    e.preventDefault();

    drawing = true;

    canvas.setPointerCapture(
      e.pointerId
    );

    lastX =
      e.clientX;

    lastY =
      e.clientY;

    lastTime =
      performance.now();

    strokePoints = [];

    strokeCount++;

    hueBase =
      (
        hueBase +
        37 +
        Math.random() * 70
      ) % 360;


    ctx.beginPath();

    ctx.arc(
      lastX,
      lastY,
      1.5,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      `hsla(
        ${hueBase},
        80%,
        50%,
        .75
      )`;

    ctx.fill();

  }
);


canvas.addEventListener(
  "pointermove",
  function(e) {

    if (!drawing) return;

    e.preventDefault();

    drawGesture(
      e.clientX,
      e.clientY,
      performance.now()
    );

  }
);


function stopDrawing(e) {

  if (!drawing) return;

  drawing = false;

  try {

    canvas.releasePointerCapture(
      e.pointerId
    );

  } catch (_) {}

}


canvas.addEventListener(
  "pointerup",
  stopDrawing
);

canvas.addEventListener(
  "pointercancel",
  stopDrawing
);

canvas.addEventListener(
  "pointerleave",
  function(e) {

    if (e.buttons === 0) {
      stopDrawing(e);
    }

  }
);


/* =========================================================
   GENERATIVE MODE
========================================================= */

function generateArtwork() {

  clearCanvas();

  intro.classList.add(
    "hidden"
  );

  const centerX =
    width / 2;

  const centerY =
    height / 2;

  const amount =
    4 +
    Math.floor(
      Math.random() * 8
    );

  hueBase =
    Math.random() * 360;


  for (
    let s = 0;
    s < amount;
    s++
  ) {

    strokeCount++;

    let x =
      centerX +
      (
        Math.random() - .5
      ) *
      width *
      .65;

    let y =
      centerY +
      (
        Math.random() - .5
      ) *
      height *
      .55;

    let angle =
      Math.random() *
      Math.PI *
      2;

    let length =
      100 +
      Math.random() *
      Math.min(
        width,
        height
      ) *
      .8;

    let steps =
      80 +
      Math.floor(
        Math.random() * 100
      );


    for (
      let i = 0;
      i < steps;
      i++
    ) {

      const progress =
        i / steps;

      const speed =
        1.5 +
        progress * 5;

      angle +=
        (
          Math.random() - .5
        ) *
        .16;

      const wave =
        Math.sin(
          progress *
          Math.PI *
          4 +
          s
        ) *
        (
          4 +
          progress * 16
        );

      const nx =
        -Math.sin(angle);

      const ny =
        Math.cos(angle);

      const nextX =
        x +
        Math.cos(angle) *
        (length / steps) +
        nx *
        wave *
        .035;

      const nextY =
        y +
        Math.sin(angle) *
        (length / steps) +
        ny *
        wave *
        .035;

      const hue =
        (
          hueBase +
          s * 38 +
          progress * 110 +
          Math.sin(
            progress * 8
          ) *
          25
        ) % 360;


      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        nextX +
        nx * wave,
        nextY +
        ny * wave
      );

      ctx.strokeStyle =
        `hsla(
          ${hue},
          78%,
          ${45 + progress * 12}%,
          ${.35 + progress * .4}
        )`;

      ctx.lineWidth =
        .8 +
        progress * 3.5 +
        Math.random() * 1.8;

      ctx.lineCap =
        "round";

      ctx.stroke();

      x = nextX;
      y = nextY;
    }
  }


  hasDrawing = true;

  saveBtn.style.display =
    "block";

  counter.textContent =
    "TRACE / " +
    String(strokeCount)
      .padStart(3, "0");
}


/* =========================================================
   BUTTONS
========================================================= */

document
  .getElementById("clearBtn")
  .addEventListener(
    "click",
    clearCanvas
  );

document
  .getElementById("generateBtn")
  .addEventListener(
    "click",
    generateArtwork
  );


/* =========================================================
   NAVIGATION
========================================================= */

const gallery =
  document.getElementById(
    "gallery"
  );

const galleryGrid =
  document.getElementById(
    "galleryGrid"
  );


document
  .getElementById("createBtn")
  .addEventListener(
    "click",
    function() {

      gallery.style.display =
        "none";

      document
        .getElementById(
          "createBtn"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "galleryBtn"
        )
        .classList.remove(
          "active"
        );

    }
  );


document
  .getElementById("galleryBtn")
  .addEventListener(
    "click",
    function() {

      showGallery();

      document
        .getElementById(
          "galleryBtn"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "createBtn"
        )
        .classList.remove(
          "active"
        );

    }
  );


document
  .getElementById("closeGallery")
  .addEventListener(
    "click",
    function() {

      gallery.style.display =
        "none";

      document
        .getElementById(
          "createBtn"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "galleryBtn"
        )
        .classList.remove(
          "active"
        );

    }
  );


/* =========================================================
   GALLERY
========================================================= */

async function showGallery() {

  gallery.style.display =
    "block";

  galleryGrid.innerHTML =
    '<div class="empty-gallery">LOADING TRACES…</div>';


  const {
    data,
    error
  } =
    await db
      .from("traces")
      .select(
        "id, trace_number, title, image_data, created_at"
      )
      .order(
        "trace_number",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    galleryGrid.innerHTML =
      '<div class="empty-gallery">THE GALLERY COULD NOT BE LOADED.</div>';

    return;
  }


  renderGallery(
    data || []
  );
}


function renderGallery(
  traces
) {

  galleryGrid.innerHTML =
    "";


  if (!traces.length) {

    galleryGrid.innerHTML =
      '<div class="empty-gallery">NO TRACES YET — BE THE FIRST.</div>';

    return;
  }


  traces.forEach(
    trace => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "trace-card";


      const imageWrap =
        document.createElement(
          "div"
        );

      imageWrap.className =
        "trace-image-wrap";


      const image =
        document.createElement(
          "img"
        );

      image.className =
        "trace-image";

      image.src =
        trace.image_data;

      image.alt =
        trace.title;

      image.loading =
        "lazy";


      imageWrap.appendChild(
        image
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "trace-info";


      const left =
        document.createElement(
          "div"
        );


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "trace-number";

      number.textContent =
        "TRACE " +
        String(
          trace.trace_number
        )
        .padStart(
          3,
          "0"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "trace-name";

      name.textContent =
        trace.title;


      left.appendChild(
        number
      );

      left.appendChild(
        name
      );


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "trace-date";

      date.textContent =
        formatDate(
          trace.created_at
        );


      info.appendChild(
        left
      );

      info.appendChild(
        date
      );


      card.appendChild(
        imageWrap
      );

      card.appendChild(
        info
      );


      galleryGrid.appendChild(
        card
      );

    }
  );
}


function formatDate(
  dateString
) {

  const date =
    new Date(
      dateString
    );

  return date.toLocaleDateString(
    "en-GB",
    {
      day: "2-digit",
      month: "2-digit",
      year: "numeric"
    }
  );
}


/* =========================================================
   SAVE MODAL
========================================================= */

const saveModal =
  document.getElementById(
    "saveModal"
  );

const titleInput =
  document.getElementById(
    "titleInput"
  );

const modalMessage =
  document.getElementById(
    "modalMessage"
  );


async function openSaveModal() {

  if (!hasDrawing) return;

  modalMessage.textContent =
    "";


  const {
    data,
    error
  } =
    await db
      .from("traces")
      .select(
        "trace_number"
      )
      .order(
        "trace_number",
        {
          ascending: false
        }
      )
      .limit(1);


  let nextNumber =
    1;


  if (
    !error &&
    data &&
    data.length
  ) {

    nextNumber =
      Number(
        data[0].trace_number
      ) + 1;

  }


  titleInput.value =
    "TRACE " +
    String(
      nextNumber
    ).padStart(
      3,
      "0"
    );


  saveModal.style.display =
    "flex";


  setTimeout(
    () => {

      titleInput.focus();
      titleInput.select();

    },
    100
  );
}


document
  .getElementById("saveBtn")
  .addEventListener(
    "click",
    openSaveModal
  );


document
  .getElementById("cancelSave")
  .addEventListener(
    "click",
    function() {

      saveModal.style.display =
        "none";

    }
  );


/* =========================================================
   CONFIRM SAVE
========================================================= */

document
  .getElementById("confirmSave")
  .addEventListener(
    "click",
    saveArtwork
  );


titleInput.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Enter"
    ) {

      saveArtwork();

    }

    if (
      e.key === "Escape"
    ) {

      saveModal.style.display =
        "none";

    }

  }
);


async function saveArtwork() {

  const title =
    titleInput.value.trim();


  if (!title) {

    modalMessage.textContent =
      "PLEASE ENTER A NAME.";

    return;
  }


  modalMessage.textContent =
    "SAVING…";


  const imageData =
    canvas.toDataURL(
      "image/jpeg",
      0.88
    );


  const {
    data,
    error
  } =
    await db
      .from("traces")
      .insert({
        title: title,
        image_data: imageData
      })
      .select(
        "id, trace_number, title, created_at"
      )
      .single();


  if (error) {

    console.error(error);

    modalMessage.textContent =
      "COULD NOT SAVE THE TRACE.";

    return;
  }


  modalMessage.textContent =
    "SAVED.";


  setTimeout(
    () => {

      saveModal.style.display =
        "none";

      saveBtn.style.display =
        "none";

      showGallery();


      document
        .getElementById(
          "galleryBtn"
        )
        .classList.add(
          "active"
        );


      document
        .getElementById(
          "createBtn"
        )
        .classList.remove(
          "active"
        );

    },
    500
  );
}


/* =========================================================
   INITIAL STATE
========================================================= */

clearCanvas();

</script>

</body>
