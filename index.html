<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TRACE — Gesture / Algorithm / Line</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --paper:#f5f3ee;
  --ink:#111;
  --soft:#77736d;
  --border:rgba(17,17,17,.16);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  position:fixed;
  inset:0;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* HEADER */

header{
  position:fixed;
  z-index:20;
  top:0;
  left:0;
  right:0;
  padding:28px 34px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
}

.brand,
nav{
  pointer-events:auto;
}

.brand h1{
  font-size:15px;
  font-weight:500;
  letter-spacing:.28em;
}

.brand p{
  margin-top:7px;
  font-size:9px;
  letter-spacing:.2em;
  color:var(--soft);
}

nav{
  display:flex;
  gap:26px;
}

.nav-btn{
  position:relative;
  border:0;
  background:none;
  color:var(--ink);
  padding:3px 0;
  font-size:10px;
  letter-spacing:.18em;
}

.nav-btn:after{
  content:"";
  position:absolute;
  left:0;
  bottom:-5px;
  width:0;
  height:1px;
  background:currentColor;
  transition:.3s;
}

.nav-btn.active:after,
.nav-btn:hover:after{
  width:100%;
}

.counter{
  position:fixed;
  z-index:20;
  right:34px;
  top:91px;
  color:var(--soft);
  font-size:9px;
  letter-spacing:.18em;
}

/* INTRO */

.intro{
  position:fixed;
  z-index:10;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  pointer-events:none;
  transition:.8s ease;
}

.intro.hidden{
  opacity:0;
  transform:translate(-50%,-47%);
}

.intro h2{
  font-size:clamp(45px,9vw,110px);
  font-weight:400;
  letter-spacing:.08em;
  line-height:.9;
}

.intro p{
  margin-top:28px;
  color:var(--soft);
  font-size:10px;
  letter-spacing:.18em;
  line-height:1.7;
}

/* CONTROLS */

.controls{
  position:fixed;
  z-index:20;
  left:34px;
  right:34px;
  bottom:30px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  pointer-events:none;
}

.control-group{
  display:flex;
  gap:10px;
  pointer-events:auto;
}

.action{
  border:1px solid var(--border);
  background:rgba(245,243,238,.84);
  backdrop-filter:blur(8px);
  color:var(--ink);
  padding:11px 16px;
  font-size:9px;
  letter-spacing:.16em;
  transition:.25s;
}

.action:hover{
  background:var(--ink);
  color:var(--paper);
}

.action.primary{
  background:var(--ink);
  border-color:var(--ink);
  color:var(--paper);
}

.save{
  display:none;
  pointer-events:auto;
}

/* GALLERY */

#gallery{
  position:fixed;
  z-index:50;
  inset:0;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--paper);
  touch-action:pan-y;
}

.gallery-header{
  padding:28px 34px 20px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.gallery-title{
  font-size:15px;
  letter-spacing:.28em;
}

.gallery-subtitle{
  margin-top:7px;
  color:var(--soft);
  font-size:9px;
  letter-spacing:.18em;
}

.close-gallery{
  border:0;
  background:none;
  color:var(--ink);
  font-size:10px;
  letter-spacing:.18em;
}

.gallery-grid{
  padding:35px 34px 80px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:45px 24px;
}

.empty{
  grid-column:1/-1;
  padding:20vh 0;
  text-align:center;
  color:var(--soft);
  font-size:10px;
  letter-spacing:.18em;
}

.card{
  min-width:0;
}

.image-wrap{
  width:100%;
  aspect-ratio:1.45/1;
  overflow:hidden;
  background:#ebe8e0;
}

.image-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:.7s;
}

.card:hover img{
  transform:scale(1.025);
}

.info{
  padding-top:13px;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.number{
  margin-bottom:5px;
  color:var(--soft);
  font-size:8px;
  letter-spacing:.16em;
}

.name{
  font-size:12px;
  letter-spacing:.03em;
}

.date{
  color:var(--soft);
  font-size:8px;
  letter-spacing:.08em;
  white-space:nowrap;
  text-align:right;
}

/* MODAL */

.modal{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(17,17,17,.18);
  backdrop-filter:blur(7px);
}

.modal-box{
  width:min(480px,calc(100% - 40px));
  padding:32px;
  background:var(--paper);
  box-shadow:0 25px 80px rgba(0,0,0,.12);
}

.modal-label{
  margin-bottom:12px;
  color:var(--soft);
  font-size:8px;
  letter-spacing:.2em;
}

.modal-box h3{
  margin-bottom:24px;
  font-size:22px;
  font-weight:400;
  letter-spacing:.05em;
}

#titleInput{
  width:100%;
  border:0;
  border-bottom:1px solid var(--ink);
  outline:0;
  background:transparent;
  padding:11px 0;
  color:var(--ink);
  font-size:15px;
}

.modal-actions{
  margin-top:28px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.message{
  min-height:13px;
  margin-top:13px;
  color:#a33;
  font-size:9px;
}

/* MOBILE */

@media(max-width:700px){

  header{
    padding:22px 20px;
  }

  .brand h1{
    font-size:13px;
  }

  .brand p{
    font-size:7px;
  }

  nav{
    gap:15px;
  }

  .nav-btn{
    font-size:8px;
  }

  .counter{
    top:76px;
    right:20px;
    font-size:8px;
  }

  .intro h2{
    font-size:48px;
  }

  .intro p{
    max-width:270px;
    font-size:8px;
  }

  .controls{
    left:20px;
    right:20px;
    bottom:20px;
  }

  .action{
    padding:10px 12px;
    font-size:8px;
  }

  .gallery-header{
    padding:22px 20px;
  }

  .gallery-grid{
    padding:25px 20px 70px;
    grid-template-columns:1fr;
    gap:35px;
  }
}
</style>
</head>

<body>

<div id="app">

<canvas id="canvas"></canvas>

<header>

  <div class="brand">
    <h1>TRACE</h1>
    <p>GESTURE / ALGORITHM / LINE</p>
  </div>

  <nav>
    <button class="nav-btn active" id="createBtn">CREATE</button>
    <button class="nav-btn" id="galleryBtn">GALLERY</button>
  </nav>

</header>

<div class="counter" id="counter">
  TRACE / 000
</div>

<div class="intro" id="intro">
  <h2>TRACE</h2>
  <p>
    MOVE ACROSS THE SURFACE.<br>
    YOUR GESTURE BECOMES A TRACE.
  </p>
</div>

<div class="controls">

  <div class="control-group">

    <button class="action" id="clearBtn">
      CLEAR
    </button>

    <button class="action" id="generateBtn">
      GENERATE
    </button>

  </div>

  <button class="action primary save" id="saveBtn">
    SAVE TRACE
  </button>

</div>

</div>


<!-- GALLERY -->

<section id="gallery">

  <div class="gallery-header">

    <div>
      <div class="gallery-title">
        GALLERY
      </div>

      <div class="gallery-subtitle">
        A COLLECTIVE ARCHIVE OF GESTURES
      </div>
    </div>

    <button class="close-gallery" id="closeGallery">
      CLOSE ×
    </button>

  </div>

  <div class="gallery-grid" id="galleryGrid">
    <div class="empty">
      LOADING TRACES…
    </div>
  </div>

</section>


<!-- SAVE MODAL -->

<div class="modal" id="modal">

  <div class="modal-box">

    <div class="modal-label">
      NEW WORK
    </div>

    <h3>
      Name your trace
    </h3>

    <input
      id="titleInput"
      type="text"
      maxlength="80"
      autocomplete="off"
      spellcheck="false"
    >

    <div class="message" id="message"></div>

    <div class="modal-actions">

      <button class="action" id="cancel">
        CANCEL
      </button>

      <button class="action primary" id="confirm">
        SAVE
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://xmhrmpbqmivbqhhrixvu.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_9WsX5CWWMeRnBs-sLIYvKA_l_8djSy0";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");

const intro =
  document.getElementById("intro");

const counter =
  document.getElementById("counter");

const saveBtn =
  document.getElementById("saveBtn");

const modal =
  document.getElementById("modal");

const titleInput =
  document.getElementById("titleInput");

const message =
  document.getElementById("message");

const gallery =
  document.getElementById("gallery");

const galleryGrid =
  document.getElementById("galleryGrid");


/* =====================================================
   CANVAS
===================================================== */

let W = 0;
let H = 0;

let drawing = false;
let hasDrawing = false;

let lastX = 0;
let lastY = 0;
let lastTime = 0;

let strokes = 0;
let hue = Math.random() * 360;


function resize(){

  const ratio =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = W * ratio;
  canvas.height = H * ratio;

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    ratio,
    0,
    0,
    ratio,
    0,
    0
  );

  clearCanvas();
}

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   CLEAR
===================================================== */

function clearCanvas(){

  ctx.fillStyle = "#f5f3ee";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  hasDrawing = false;
  strokes = 0;

  saveBtn.style.display = "none";

  intro.classList.remove("hidden");

  counter.textContent =
    "TRACE / 000";
}


/* =====================================================
   DRAW
===================================================== */

function draw(x,y,time){

  if(!drawing) return;

  const dx = x-lastX;
  const dy = y-lastY;

  const distance =
    Math.sqrt(
      dx*dx + dy*dy
    );

  if(distance < 1) return;

  const dt =
    Math.max(
      time-lastTime,
      1
    );

  const speed =
    distance/dt;

  const angle =
    Math.atan2(dy,dx);

  const nx =
    -Math.sin(angle);

  const ny =
    Math.cos(angle);

  const wave =
    Math.sin(
      time*.012 +
      distance*.08
    ) *
    (
      2 +
      Math.min(
        speed*.7,
        10
      )
    );

  const random =
    (
      Math.random()-.5
    ) *
    (
      1.5 +
      Math.min(
        speed*.25,
        5
      )
    );

  const px =
    x + nx*(wave+random);

  const py =
    y + ny*(wave+random);

  const currentHue =
    (
      hue +
      angle*45 +
      speed*18 +
      strokes*4
    ) % 360;

  const alpha =
    .5 +
    Math.min(
      speed*.025,
      .25
    );

  const lineWidth =
    1.2 +
    Math.min(
      speed*.18,
      5
    );


  ctx.beginPath();

  ctx.moveTo(
    lastX,
    lastY
  );

  ctx.quadraticCurveTo(
    (lastX+px)/2 + nx*wave,
    (lastY+py)/2 + ny*wave,
    px,
    py
  );

  ctx.strokeStyle =
    `hsla(
      ${currentHue},
      78%,
      ${45+Math.min(speed*2,12)}%,
      ${alpha}
    )`;

  ctx.lineWidth =
    lineWidth;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";

  ctx.stroke();


  /* algorithmic echo */

  if(speed > 2){

    const echo =
      5 +
      Math.min(
        speed*.8,
        12
      );

    ctx.beginPath();

    ctx.moveTo(
      lastX,
      lastY
    );

    ctx.quadraticCurveTo(
      (lastX+px)/2 + nx*(wave+echo),
      (lastY+py)/2 + ny*(wave+echo),
      px+nx*2,
      py+ny*2
    );

    ctx.strokeStyle =
      `hsla(
        ${(currentHue+28)%360},
        82%,
        58%,
        ${alpha*.27}
      )`;

    ctx.lineWidth =
      Math.max(
        .5,
        lineWidth*.45
      );

    ctx.stroke();
  }


  lastX = x;
  lastY = y;
  lastTime = time;

  hasDrawing = true;

  intro.classList.add("hidden");

  saveBtn.style.display = "block";

  counter.textContent =
    "TRACE / " +
    String(strokes)
      .padStart(3,"0");
}


/* =====================================================
   POINTER
===================================================== */

canvas.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    drawing = true;

    canvas.setPointerCapture(
      e.pointerId
    );

    lastX = e.clientX;
    lastY = e.clientY;
    lastTime = performance.now();

    strokes++;

    hue =
      (
        hue +
        40 +
        Math.random()*70
      ) % 360;

    ctx.beginPath();

    ctx.arc(
      lastX,
      lastY,
      1.5,
      0,
      Math.PI*2
    );

    ctx.fillStyle =
      `hsla(
        ${hue},
        80%,
        50%,
        .75
      )`;

    ctx.fill();
  }
);


canvas.addEventListener(
  "pointermove",
  e => {

    if(!drawing) return;

    e.preventDefault();

    draw(
      e.clientX,
      e.clientY,
      performance.now()
    );
  }
);


function stop(e){

  drawing = false;

  try{
    canvas.releasePointerCapture(
      e.pointerId
    );
  }catch(_){}
}

canvas.addEventListener(
  "pointerup",
  stop
);

canvas.addEventListener(
  "pointercancel",
  stop
);


/* =====================================================
   GENERATE
===================================================== */

function generate(){

  clearCanvas();

  intro.classList.add("hidden");

  hue =
    Math.random()*360;

  const count =
    5 +
    Math.floor(
      Math.random()*7
    );

  const cx = W/2;
  const cy = H/2;

  for(
    let s=0;
    s<count;
    s++
  ){

    strokes++;

    let x =
      cx +
      (
        Math.random()-.5
      ) *
      W*.75;

    let y =
      cy +
      (
        Math.random()-.5
      ) *
      H*.65;

    let angle =
      Math.random() *
      Math.PI*2;

    const length =
      120 +
      Math.random() *
      Math.min(W,H) *
      .8;

    const steps =
      100 +
      Math.floor(
        Math.random()*80
      );


    for(
      let i=0;
      i<steps;
      i++
    ){

      const p =
        i/steps;

      angle +=
        (
          Math.random()-.5
        )*.16;

      const wave =
        Math.sin(
          p*Math.PI*4+s
        ) *
        (
          4+p*18
        );

      const nx =
        -Math.sin(angle);

      const ny =
        Math.cos(angle);

      const nx2 =
        x +
        Math.cos(angle) *
        (length/steps);

      const ny2 =
        y +
        Math.sin(angle) *
        (length/steps);

      const endX =
        nx2 +
        nx*wave;

      const endY =
        ny2 +
        ny*wave;

      const c =
        (
          hue +
          s*38 +
          p*120
        ) % 360;

      ctx.beginPath();

      ctx.moveTo(
        x,
        y
      );

      ctx.lineTo(
        endX,
        endY
      );

      ctx.strokeStyle =
        `hsla(
          ${c},
          80%,
          ${45+p*12}%,
          ${.38+p*.38}
        )`;

      ctx.lineWidth =
        .8 +
        p*3.8 +
        Math.random()*1.5;

      ctx.lineCap =
        "round";

      ctx.stroke();

      x = nx2;
      y = ny2;
    }
  }

  hasDrawing = true;

  saveBtn.style.display =
    "block";

  counter.textContent =
    "TRACE / " +
    String(strokes)
      .padStart(3,"0");
}


/* =====================================================
   GALLERY
===================================================== */

async function showGallery(){

  gallery.style.display =
    "block";

  galleryGrid.innerHTML =
    '<div class="empty">LOADING TRACES…</div>';

  const result =
    await db
      .from("traces")
      .select(
        "id,trace_number,title,image_data,created_at"
      )
      .order(
        "trace_number",
        {
          ascending:false
        }
      );

  if(result.error){

    console.error(
      result.error
    );

    galleryGrid.innerHTML =
      '<div class="empty">THE GALLERY COULD NOT BE LOADED.</div>';

    return;
  }

  renderGallery(
    result.data || []
  );
}


function renderGallery(items){

  galleryGrid.innerHTML = "";

  if(!items.length){

    galleryGrid.innerHTML =
      '<div class="empty">NO TRACES YET — BE THE FIRST.</div>';

    return;
  }


  items.forEach(
    item => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card";


      const wrap =
        document.createElement(
          "div"
        );

      wrap.className =
        "image-wrap";


      const img =
        document.createElement(
          "img"
        );

      img.src =
        item.image_data;

      img.alt =
        item.title;

      img.loading =
        "lazy";


      wrap.appendChild(
        img
      );


      const info =
        document.createElement(
          "div"
        );

      info.className =
        "info";


      const left =
        document.createElement(
          "div"
        );


      const number =
        document.createElement(
          "div"
        );

      number.className =
        "number";

      number.textContent =
        "TRACE " +
        String(
          item.trace_number
        ).padStart(
          3,
          "0"
        );


      const name =
        document.createElement(
          "div"
        );

      name.className =
        "name";

      name.textContent =
        item.title;


      left.appendChild(
        number
      );

      left.appendChild(
        name
      );


      const date =
        document.createElement(
          "div"
        );

      date.className =
        "date";

      date.textContent =
        new Date(
          item.created_at
        ).toLocaleDateString(
          "en-GB",
          {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
          }
        );


      info.appendChild(
        left
      );

      info.appendChild(
        date
      );


      card.appendChild(
        wrap
      );

      card.appendChild(
        info
      );

      galleryGrid.appendChild(
        card
      );
    }
  );
}


/* =====================================================
   SAVE MODAL
===================================================== */

async function openSave(){

  if(!hasDrawing) return;

  /*
    IMPORTANT:
    The modal opens immediately.
    The database is queried afterwards.
  */

  message.textContent = "";

  titleInput.value =
    "TRACE 001";

  modal.style.display =
    "flex";

  setTimeout(
    () => {
      titleInput.focus();
      titleInput.select();
    },
    100
  );


  /*
    Try to discover the next
    gallery number in the background.
  */

  const result =
    await db
      .from("traces")
      .select("trace_number")
      .order(
        "trace_number",
        {
          ascending:false
        }
      )
      .limit(1);


  if(
    !result.error &&
    result.data &&
    result.data.length
  ){

    const next =
      Number(
        result.data[0].trace_number
      ) + 1;

    /*
      Only replace the proposed
      title if the user hasn't
      already typed something.
    */

    if(
      titleInput.value ===
      "TRACE 001"
    ){

      titleInput.value =
        "TRACE " +
        String(next)
          .padStart(3,"0");
    }
  }
}


async function saveArtwork(){

  const title =
    titleInput.value.trim();

  if(!title){

    message.textContent =
      "PLEASE ENTER A NAME.";

    return;
  }

  message.textContent =
    "SAVING…";


  /*
    JPEG makes the shared database
    considerably smaller.
  */

  const image =
    canvas.toDataURL(
      "image/jpeg",
      .88
    );


  const result =
    await db
      .from("traces")
      .insert({
        title:title,
        image_data:image
      })
      .select(
        "id,trace_number,title,created_at"
      )
      .single();


  if(result.error){

    console.error(
      result.error
    );

    message.textContent =
      "COULD NOT SAVE THE TRACE.";

    return;
  }


  message.textContent =
    "SAVED.";


  setTimeout(
    () => {

      modal.style.display =
        "none";

      saveBtn.style.display =
        "none";

      showGallery();

      document
        .getElementById(
          "galleryBtn"
        )
        .classList.add(
          "active"
        );

      document
        .getElementById(
          "createBtn"
        )
        .classList.remove(
          "active"
        );

    },
    500
  );
}
